schema_version = 1
# Canonical authored skills live here. Native paths are relative to the user's home.
skills_source = "agents/skills"
# Empty JSON/TOML are valid native defaults. Add reviewed native keys here.
# Paths are explicit per OS; WSL intentionally uses Linux-native tools and paths.
# render = false detects an agent but writes nothing for it until a tested install confirms its paths.

[agents.claude]
render = true
# Fleet writes the plugin listing here; the agent installs the plugin at start.
plugin_listing_file = ".claude/settings.json"
# The agent's own plugin installer writes these files; backups keep a copy.
plugin_files = [".claude/settings.json"]
command = "claude"
mise_packages = ["claude", "claude-code", "@anthropic-ai/claude-code"]
format = "json"
supported = true
content = "{}\n"
documentation = "https://code.claude.com/docs/en/settings"
[agents.claude.config_paths]
linux = ".claude/settings.json"
darwin = ".claude/settings.json"
windows = ".claude/settings.json"
wsl = ".claude/settings.json"
[agents.claude.skills_paths]
linux = ".claude/skills"
darwin = ".claude/skills"
windows = ".claude/skills"
wsl = ".claude/skills"

[agents.codex]
render = true
# The agent's own plugin installer writes these files; backups keep a copy.
plugin_files = [".codex/config.toml"]
# Codex accepts no pointer. Fleet writes owned entries in these shared files.
mcp_file = ".codex/config.toml"
hooks_file = ".codex/hooks.json"
command = "codex"
mise_packages = ["codex", "@openai/codex"]
format = "toml"
supported = true
content = "# Generated from agents/manifest.toml. Edit the manifest, then regenerate.\n"
documentation = "https://learn.chatgpt.com/docs"
[agents.codex.config_paths]
linux = ".codex/config.toml"
darwin = ".codex/config.toml"
windows = ".codex/config.toml"
wsl = ".codex/config.toml"
[agents.codex.skills_paths]
linux = ".agents/skills"
darwin = ".agents/skills"
windows = ".agents/skills"
wsl = ".agents/skills"

[agents.gemini]
render = true
# The agent's own plugin installer writes these files; backups keep a copy.
plugin_files = [".gemini/extensions/extension-enablement.json"]
command = "gemini"
mise_packages = ["gemini", "gemini-cli", "@google/gemini-cli"]
format = "json"
supported = true
content = "{}\n"
documentation = "https://geminicli.com/docs/cli/skills/"
[agents.gemini.config_paths]
linux = ".gemini/settings.json"
darwin = ".gemini/settings.json"
windows = ".gemini/settings.json"
wsl = ".gemini/settings.json"
[agents.gemini.skills_paths]
linux = ".gemini/skills"
darwin = ".gemini/skills"
windows = ".gemini/skills"
wsl = ".gemini/skills"

[agents.grok]
render = false
render_reason = "No tested install confirms Grok Build's paths yet."
command = "grok"
# A community tool shares the grok command and ~/.grok; its settings file marks it.
conflict_markers = [".grok/user-settings.json"]
mise_packages = ["grok", "grok-cli"]
format = "toml"
supported = true
content = "# Generated from agents/manifest.toml. Edit the manifest, then regenerate.\n"
documentation = "https://docs.x.ai/build/settings"
[agents.grok.config_paths]
linux = ".grok/config.toml"
darwin = ".grok/config.toml"
windows = ".grok/config.toml"
wsl = ".grok/config.toml"
[agents.grok.skills_paths]
linux = ".grok/skills"
darwin = ".grok/skills"
windows = ".grok/skills"
wsl = ".grok/skills"

[agents.pi]
render = true
# Fleet writes the plugin listing here; the agent installs the plugin at start.
plugin_listing_file = ".pi/agent/settings.json"
# The agent's own plugin installer writes these files; backups keep a copy.
plugin_files = [".pi/agent/settings.json"]
mcp_file = ".pi/agent/mcp.json"
command = "pi"
mise_packages = ["pi", "pi-coding-agent", "@mariozechner/pi-coding-agent", "@earendil-works/pi-coding-agent"]
format = "json"
supported = true
content = "{}\n"
documentation = "https://docs.pi.dev"
[agents.pi.config_paths]
linux = ".pi/agent/settings.json"
darwin = ".pi/agent/settings.json"
windows = ".pi/agent/settings.json"
wsl = ".pi/agent/settings.json"
[agents.pi.skills_paths]
linux = ".pi/agent/skills"
darwin = ".pi/agent/skills"
windows = ".pi/agent/skills"
wsl = ".pi/agent/skills"

[agents.opencode]
render = true
# Fleet writes the plugin listing here; the agent installs the plugin at start.
plugin_listing_file = ".config/opencode/opencode.json"
# The agent's own plugin installer writes these files; backups keep a copy.
plugin_files = [".config/opencode/opencode.json"]
mcp_file = ".config/opencode/opencode.json"
command = "opencode"
mise_packages = ["opencode", "opencode-ai"]
format = "json"
supported = true
content = "{}\n"
documentation = "https://opencode.ai/docs/config/"
# OpenCode merges opencode.jsonc after opencode.json. A same-name entry there wins over Fleet's entry.
shadow_paths = [".config/opencode/opencode.jsonc"]
[agents.opencode.config_paths]
linux = ".config/opencode/opencode.json"
darwin = ".config/opencode/opencode.json"
windows = ".config/opencode/opencode.json"
wsl = ".config/opencode/opencode.json"
[agents.opencode.skills_paths]
linux = ".config/opencode/skills"
darwin = ".config/opencode/skills"
windows = ".config/opencode/skills"
wsl = ".config/opencode/skills"

[agents.antigravity]
render = false
render_reason = "No tested install confirms Antigravity's paths yet."
command = "agy"
mise_packages = ["antigravity"]
format = "json"
supported = true
documentation = "https://antigravity.google/docs"
[agents.antigravity.config_paths]
linux = ".gemini/config/mcp_config.json"
darwin = ".gemini/config/mcp_config.json"
windows = ".gemini/config/mcp_config.json"
wsl = ".gemini/config/mcp_config.json"
[agents.antigravity.skills_paths]
linux = ".gemini/config/skills"
darwin = ".gemini/config/skills"
windows = ".gemini/config/skills"
wsl = ".gemini/config/skills"

[agents.ollama]
render = false
config_folders = [".ollama"]
command = "ollama"
mise_packages = ["ollama"]
format = "environment"
supported = false
reason = "Ollama uses service/process environment variables and has no native SKILL.md loader."
documentation = "https://docs.ollama.com/faq"
[agents.ollama.config_paths]
linux = ""
darwin = ""
windows = ""
wsl = ""
[agents.ollama.skills_paths]
linux = ""
darwin = ""
windows = ""
wsl = ""
